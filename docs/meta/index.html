 
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta</title>

    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="./style.css">

    <script type="module" src="../global.js"></script>
    <script type="module" src="./main.js"></script>
</head>

<body>
    <main>
        <h1 class="Meta">Meta</h1>

        <div id="stats"></div>

        <div class="time-control">
            <label for="commit-progress">
                Show commits until:
            </label>

            <input
                type="range"
                id="commit-progress"
                min="0"
                max="100"
                value="100"
            />

            <time id="commit-time"></time>
        </div>

        <h2>Commits by time of day</h2>

        <!-- Scrollytelling section -->
        <div id="scrolly-1">

            <!-- Commit descriptions generated by JavaScript -->
            <div id="scatter-story"></div>

            <!-- Sticky scatter plot -->
            <div id="scatter-plot">
                <div id="chart"></div>

                <!-- Commit tooltip -->
                <dl id="commit-tooltip" class="info tooltip" hidden>
                    <dt>Commit</dt>
                    <dd>
                        <a href="" id="commit-link" target="_blank"></a>
                    </dd>

                    <dt>Date</dt>
                    <dd id="commit-date"></dd>

                    <dt>Time</dt>
                    <dd id="commit-time-tooltip"></dd>

                    <dt>Author</dt>
                    <dd id="commit-author"></dd>

                    <dt>Lines edited</dt>
                    <dd id="commit-lines"></dd>
                </dl>
            </div>
        </div>

        <!-- Brush selection information -->
        <p id="selection-count">No commits selected</p>

        <dl id="language-breakdown" class="stats"></dl>

        <!-- File unit visualization -->
        <dl id="files"></dl>

    </main>
</body>
</html>
